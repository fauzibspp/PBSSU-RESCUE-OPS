name: CI-01 Secure Quality Gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-01-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Scope and OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
      - name: Pin npm
        run: npm install --global npm@12.2.2
      - name: Install locked dependencies
        run: npm ci
      - name: Validate frozen delivery scopes
        run: |
          npm run scope:sprint3a
          npm run scope:sprint3b
          npm run scope:sprint3c
          npm run scope:sprint4a
      - name: Lint OpenAPI 3.1 contract
        run: npx --yes @redocly/cli@1.34.5 lint docs/api/openapi.json --format stylish

  quality:
    name: Static quality, builds and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
      - name: Pin npm
        run: npm install --global npm@12.2.2
      - name: Install locked dependencies
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build API
        run: npm run build
      - name: Build web
        run: npm run build:web
      - name: Unit and contract tests
        run: npm test -- --run

  postgres-browser:
    name: Restricted PostgreSQL and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "true"
      PBSSU_BROWSER_ACCEPTANCE_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
      - name: Pin npm
        run: npm install --global npm@12.2.2
      - name: Install locked dependencies
        run: npm ci
      - name: Create isolated Docker context and pull pinned database image
        run: |
          docker context create desktop-linux --docker "host=unix:///var/run/docker.sock"
          docker --context desktop-linux pull postgis/postgis:18-3.7@sha256:440bdd14e3edccfce04d080d8a1a0cbae5763fa16a1c4172bff83530828461de
      - name: Verify authenticated browser suite fails closed without database state
        shell: bash
        run: |
          set +e
          output=$(CI=true PBSSU_BROWSER_ACCEPTANCE_REQUIRED=1 PBSSU_BROWSER_PREFLIGHT_ONLY=1 PBSSU_TEST_DATABASE_STATE= npm run test:browser:acceptance 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! printf '%s' "$output" | grep -Fq "Required browser acceptance needs PBSSU_TEST_DATABASE_STATE"; then
            echo "The required browser suite did not fail closed on missing isolated database state."
            exit 1
          fi
          echo "Missing database state is rejected before authenticated tests run."
      - name: Generate disposable local identity keys
        run: npm run db:generate-local-identity-keys
      - name: Create isolated synthetic database
        run: |
          npm run db:sprint4a
          state_count=$(find .cache/sprint4a -maxdepth 1 -type f -name '*.json' | wc -l)
          if [ "$state_count" -ne 1 ]; then
            echo "Expected exactly one job-local Sprint 4-A database state file; found $state_count."
            exit 1
          fi
          state_file=$(find .cache/sprint4a -maxdepth 1 -type f -name '*.json' -print -quit)
          printf 'PBSSU_TEST_DATABASE_STATE=%s\n' "$state_file" >> "$GITHUB_ENV"
      - name: Run fresh/repeat migration and restricted-role inventory checks
        run: npm run db:migrate:sprint4a
      - name: Run guarded PostgreSQL integration suite
        run: npm run test:integration
      - name: Build the API for real HTTP browser acceptance
        run: npm run build
      - name: Install pinned Playwright Microsoft Edge browser
        run: npx playwright install --with-deps msedge
      - name: Run browser preview and required authenticated acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/sprint4a
          node --import tsx scripts/run-browser-api.ts > .cache/sprint4a/browser-api.log 2>&1 &
          api_pid=$!
          trap 'kill -TERM "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3301/incidents || true)
            if [ "$status" = "401" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "API readiness check did not receive the expected unauthenticated 401 response."
            exit 1
          fi
          npm run test:browser:preview
          npm run test:browser:acceptance

  secret-scan:
    name: Gitleaks outgoing history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.24.2
          cache: false
      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan all outgoing commits without printing secrets
        run: gitleaks git --log-opts="origin/main..HEAD" --redact=100 --no-banner
